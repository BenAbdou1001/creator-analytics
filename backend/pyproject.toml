[project]
name = "creator-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.162",
  "psycopg[binary]>=3.2",
  "mcp>=2.3,<3",
  "openpyxl>=3.1.5",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
]

[project.scripts]
creator-mcp = "app.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "common", "core", "database"]
only-include = ["app", "common", "core", "database", "main.py"]

[tool.pytest.ini_options]
testpaths = ["app"]
