services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
      POSTGRES_DB: creator
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
# Schema, views and the metric catalogue come from Alembic: cd backend && uv run alembic upgrade head
volumes:
  pgdata:
